<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>F1 Calculator</title>
    <link rel="stylesheet" href="styles.css" />
  </head>
  <body>
    <div class="calculator">
      <div class="calculator__header">
        <h2 class="calculator__header-title">F1 Season Points Calculator</h2>
        <p class="calculator__header-description">
          Enter the driver's finishing position for each race (1-10 for points,
          leave empty or use >10 for 0 points).
        </p>
      </div>

      <form id="points-form" class="calculator__form">
        <div class="calculator__race">
          <label for="race-1" class="calculator__race-label">Race 1</label>
          <input
            type="number"
            id="race-1"
            class="calculator__race-input"
            placeholder="Value"
            min="1"
            pattern="\d*"
          />
          <span class="calculator__error-message" id="error-race-1"
            >Please enter a valid number</span
          >
        </div>

        <div class="calculator__race">
          <label for="race-2" class="calculator__race-label">Race 2</label>
          <input
            type="number"
            id="race-2"
            class="calculator__race-input"
            placeholder="Value"
            min="1"
            pattern="\d*"
          />
          <span class="calculator__error-message" id="error-race-2"
            >Please enter a valid number</span
          >
        </div>

        <div class="calculator__race">
          <label for="race-3" class="calculator__race-label">Race 3</label>
          <input
            type="number"
            id="race-3"
            class="calculator__race-input"
            placeholder="Value"
            min="1"
            pattern="\d*"
          />
          <span class="calculator__error-message" id="error-race-3"
            >Please enter a valid number</span
          >
        </div>

        <div class="calculator__race">
          <label for="race-4" class="calculator__race-label">Race 4</label>
          <input
            type="number"
            id="race-4"
            class="calculator__race-input"
            placeholder="Value"
            min="1"
            pattern="\d*"
          />
          <span class="calculator__error-message" id="error-race-4"
            >Please enter a valid number</span
          >
        </div>

        <div class="calculator__race">
          <label for="race-5" class="calculator__race-label">Race 5</label>
          <input
            type="number"
            id="race-5"
            class="calculator__race-input"
            placeholder="Value"
            min="1"
            pattern="\d*"
          />
          <span class="calculator__error-message" id="error-race-5"
            >Please enter a valid number</span
          >
        </div>

        <button type="submit" class="calculator__form-submit">Submit</button>
      </form>

      <div id="result" class="calculator__result"></div>
    </div>

    <script src="script.js"></script>
  </body>
</html>
